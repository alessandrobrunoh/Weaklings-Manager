services:
  database:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - default

  backend:
    image: ghcr.io/alessandrobrunoh/weaklings-backend:latest
    ports:
      - "8001:3000"
    environment:
      - RUST_LOG=${RUST_LOG}
      - BACKEND_PORT=${BACKEND_PORT}
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - BOT_API_SECRET=${BOT_API_SECRET}
      - SUPER_ADMIN_DISCORD_ID=${SUPER_ADMIN_DISCORD_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALBION_GUILD_ID=${ALBION_GUILD_ID}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ALBION_API_REGION=${ALBION_API_REGION}
    depends_on:
      - database
    restart: unless-stopped
    networks:
      - default

  frontend:
    image: ghcr.io/alessandrobrunoh/weaklings-frontend:latest
    ports:
      - "5000:3000"
    environment:
      - PORT=${PORT}
      - API_REWRITE_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.weaklings.rule=Host(`weaklings.alessandrobrunoh.it`)
      - traefik.http.routers.weaklings.entrypoints=websecure
      - traefik.http.routers.weaklings.tls=true
      - traefik.http.routers.weaklings.tls.certresolver=le
      - traefik.http.services.weaklings.loadbalancer.server.port=3000

  discord-bot:
    image: ghcr.io/alessandrobrunoh/weaklings-discord-bot:latest
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - BACKEND_URL=http://backend:3000
      - BOT_API_SECRET=${BOT_API_SECRET}
      - GUILD_NAME=${GUILD_NAME}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS}
      - POLLER_STATE_DIR=/app/data
    volumes:
      - discord_bot_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  discord_bot_data:

networks:
  proxy:
    external: true
