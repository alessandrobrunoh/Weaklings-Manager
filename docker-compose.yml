services:
  database:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - default

  backend:
    image: ghcr.io/alessandrobrunoh/weaklings-backend:latest
    ports:
      # Host-only, same as the database below: the frontend reaches this
      # service over the internal `default` network at http://backend:3000
      # (see API_REWRITE_URL), so publishing on every interface only handed
      # an unauthenticated path straight to the backend — cookies set with
      # `Secure` don't stop a plain-HTTP request from reaching it directly.
      - "127.0.0.1:8001:3000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - BACKEND_PORT=3000
      - DATABASE_URL=${DOCKER_DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - BOT_API_SECRET=${BOT_API_SECRET:?BOT_API_SECRET must be set to a non-empty value (the backend and the bot share it)}
      - SUPER_ADMIN_DISCORD_ID=${SUPER_ADMIN_DISCORD_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - ALBION_GUILD_ID=${ALBION_GUILD_ID}
      - ALBION_ALLIED_GUILD_IDS=${ALBION_ALLIED_GUILD_IDS:-}
      - ALBION_ALLIED_GUILD_NAMES=${ALBION_ALLIED_GUILD_NAMES:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ALBION_API_REGION=${ALBION_API_REGION}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-albion-guild-manager-backend}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  frontend:
    image: ghcr.io/alessandrobrunoh/weaklings-frontend:latest
    ports:
      - "5000:3000"
    environment:
      - PORT=3000
      - API_REWRITE_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.weaklings.rule=Host(`weaklings.alessandrobrunoh.it`)
      - traefik.http.routers.weaklings.entrypoints=websecure
      - traefik.http.routers.weaklings.tls=true
      - traefik.http.routers.weaklings.tls.certresolver=le
      - traefik.http.services.weaklings.loadbalancer.server.port=3000

  discord-bot:
    image: ghcr.io/alessandrobrunoh/weaklings-discord-bot:latest
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - BACKEND_URL=http://backend:3000
      - BOT_API_SECRET=${BOT_API_SECRET:?BOT_API_SECRET must be set to a non-empty value (the backend and the bot share it)}
      - GUILD_NAME=${GUILD_NAME}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS}
      - POLLER_STATE_DIR=/app/data
    volumes:
      - discord_bot_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  discord_bot_data:

networks:
  proxy:
    external: true
