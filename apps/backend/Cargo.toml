[package]
name = "backend"
version = "0.0.3"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
pedantic = "warn"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
envy = "0.4"
utoipa = { version = "5.2.0" }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
sea-orm = { version = "1.1.0", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-rust_decimal"] }
sea-orm-migration = { version = "1.1.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
rust_decimal = "1.42"
chrono = "0.4"
thiserror = "1"
strum = { version = "0.27", features = ["derive"] }
reqwest = { version = "0.12.0", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
axum-extra = { version = "0.10.0", features = ["cookie"] }
urlencoding = "2.1.3"
time = "0.3"
base64 = "0.22"
