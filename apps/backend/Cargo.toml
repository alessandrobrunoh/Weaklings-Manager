# The backend is its own Cargo workspace rooted here, so a Docker build whose context is
# apps/backend sees the workspace manifest, every crate and Cargo.lock.
[workspace]
resolver = "2"
members = [".", "crates/*"]

[workspace.package]
version = "0.0.3"
edition = "2024"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
envy = "0.4"
utoipa = { version = "5.2.0", features = ["chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
sea-orm = { version = "1.1.0", default-features = false, features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json", "with-chrono", "with-rust_decimal", "with-uuid"] }
sea-orm-migration = { version = "1.1.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
rust_decimal = "1.42"
chrono = "0.4"
thiserror = "1"
strum = { version = "0.27", features = ["derive"] }
reqwest = { version = "0.12.0", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
axum-extra = { version = "0.10.0", features = ["cookie-private"] }
urlencoding = "2.1.3"
unicode-normalization = "0.1"
time = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
subtle = "2.6"
dashmap = "6"
serde_urlencoded = "0.7"
tower = { version = "0.5.3", features = ["util"] }

backend-core = { path = "crates/core" }
backend-gamedata = { path = "crates/gamedata" }
backend-migration = { path = "crates/migration" }
backend-entities = { path = "crates/entities" }
backend-identity = { path = "crates/identity" }
backend-runtime = { path = "crates/runtime" }
backend-albion-data = { path = "crates/albion-data" }
backend-progression = { path = "crates/progression" }
backend-community = { path = "crates/community" }
backend-battles = { path = "crates/battles" }
backend-comps = { path = "crates/comps" }
backend-combat = { path = "crates/combat" }
backend-intel = { path = "crates/intel" }
backend-bank = { path = "crates/bank" }
backend-splits = { path = "crates/splits" }
backend-regear = { path = "crates/regear" }
backend-events = { path = "crates/events" }
backend-fights = { path = "crates/fights" }
backend-rewards = { path = "crates/rewards" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

# Dev builds: keep file:line in backtraces for our code, drop the full
# debuginfo that made target/ grow by gigabytes and slowed linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The bundled SQLite C library runs every SQLite-backed test; at the dev default
# (-O0) it is several times slower. Optimising only this crate costs one extra C
# compile, cached afterwards, and leaves our own code's dev settings untouched.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[package]
name = "backend"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dotenvy.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-scalar.workspace = true
backend-core.workspace = true
backend-gamedata.workspace = true
backend-migration.workspace = true
backend-entities.workspace = true
backend-identity.workspace = true
backend-runtime.workspace = true
backend-albion-data.workspace = true
backend-progression.workspace = true
backend-community.workspace = true
backend-battles.workspace = true
backend-comps.workspace = true
backend-combat.workspace = true
backend-intel.workspace = true
backend-bank.workspace = true
backend-splits.workspace = true
backend-regear.workspace = true
backend-events.workspace = true
backend-fights.workspace = true
backend-rewards.workspace = true

[dev-dependencies]
serde_json.workspace = true
backend-core = { workspace = true, features = ["test-support"] }
backend-migration = { workspace = true, features = ["test-support"] }
backend-identity = { workspace = true, features = ["test-support"] }
backend-runtime = { workspace = true, features = ["test-support"] }
backend-albion-data = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
