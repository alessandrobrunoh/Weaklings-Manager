test-support = ["backend-core/test-support", "backend-identity/test-support", "backend-runtime/test-support"]

[dependencies]
axum.workspace = true
chrono.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
urlencoding.workspace = true
utoipa.workspace = true
backend-core.workspace = true
backend-entities.workspace = true
backend-identity.workspace = true
backend-runtime.workspace = true

[dev-dependencies]
backend-core = { workspace = true, features = ["test-support"] }
backend-identity = { workspace = true, features = ["test-support"] }
backend-runtime = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
