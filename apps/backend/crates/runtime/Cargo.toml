[package]
name = "backend-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test helpers for other crates' tests. Enabled only from [dev-dependencies].
test-support = ["backend-core/test-support", "backend-identity/test-support", "dep:backend-migration", "backend-migration/test-support", "dep:tower"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
rand.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true
backend-migration = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
backend-core.workspace = true
backend-entities.workspace = true
backend-identity.workspace = true

[dev-dependencies]
sea-orm-migration.workspace = true
tower.workspace = true
backend-core = { workspace = true, features = ["test-support"] }
backend-migration = { workspace = true, features = ["test-support"] }
backend-identity = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
