[package]
name = "backend-migration"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test helpers for other crates' tests. Enabled only from [dev-dependencies].
test-support = ["dep:backend-core", "backend-core/test-support", "dep:tokio"]

[dependencies]
async-trait.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
tracing.workspace = true
backend-core = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
backend-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
