<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weaklings</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Pre-boot theme: ThemeService only sets the html class after Angular boots,
    so without this the first paint uses the light :root defaults and flips to
    dark. Mirrors ThemeService (storage key "alm.theme", dark when unset).
  -->
  <script>
    (function () {
      var dark = true;
      try {
        var saved = localStorage.getItem('alm.theme');
        if (saved === 'light') {
          dark = false;
        } else if (saved === 'system') {
          dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }
      } catch (e) {}
      var root = document.documentElement;
      root.classList.add(dark ? 'dark' : 'light');
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!--
    Type system (DESIGN.md): Nunito 800 stands in for ABC Ginto Nord and carries
    every display headline in all-caps, Inter stands in for gg sans across the
    product UI, and Geist Mono marks technical content (ids, timestamps, silver).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&family=Geist+Mono:wght@400;500&display=swap"
  >
</head>
<body>
  <app-root></app-root>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
